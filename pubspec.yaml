name: phone_number_scanner
description: "A Google Lens style live camera scanner application that extracts phone numbers using Google ML Kit and Cloud Firestore."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
